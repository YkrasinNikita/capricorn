name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Capri for tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build onedir application
        run: python -m PyInstaller --noconfirm --clean build.spec

      - name: Pack artifact
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "master" -or $tag -eq "main") {
            $tag = "manual-$(Get-Date -Format yyyyMMdd-HHmm)"
          }
          $zip = "Capri-$tag-win64.zip"
          Compress-Archive -Path "dist/Capri/*" -DestinationPath $zip -Force
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Capri-win64
          path: ${{ env.RELEASE_ZIP }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "${{ env.RELEASE_ZIP }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "Capri $tag" --generate-notes
          }
